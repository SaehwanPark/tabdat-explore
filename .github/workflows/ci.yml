name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format --check .

      - name: Run basedpyright
        run: uv run basedpyright

      - name: Run Documentation Alignment
        run: uv run python scripts/check_docs_alignment.py

      - name: Run Pytest
        run: uv run pytest

      - name: Run Integrated E2E Scenarios
        run: uv run python integrated_testing/run_e2e.py

  wheel-smoke:
    name: Clean Wheel Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Build distribution artifacts
        run: uv build

      - name: Test clean wheel install in isolated tool environment
        run: |
          uv tool install --from . tabdat-explore
          tabdat doctor
          tabdat -c "help summarize"
